services:
  ministack:
    image: ministackorg/ministack:full
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: sa-east-1
      MINISTACK_ACCOUNT_ID: "000000000000"
      GATEWAY_PORT: "4566"
      PERSIST_STATE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ministack-data:/var/lib/ministack

volumes:
  ministack-data:
