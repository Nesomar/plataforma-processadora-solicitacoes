server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # Default só serve pra dev local/testes sem env var setada — nunca usar em produção
    # (design.md decisão 1: HS256 com segredo fixo, trocado via secret manager em prod).
    signing-secret: ${JWT_SIGNING_SECRET:dev-local-insecure-jwt-signing-secret-troque-em-producao}

spring:
  application:
    name: backend
  webflux:
    multipart:
      max-in-memory-size: 10MB
      max-disk-usage-per-part: 10MB
      # WebFlux não tem "max-request-size" agregado (diferente do servlet) — max-parts limita o
      # número de partes pra impedir que o total (parts x max-disk-usage-per-part) fique ilimitado.
      max-parts: 4

aws:
  region: ${AWS_REGION:sa-east-1}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
  dynamodb:
    table-name: ${AWS_DYNAMODB_TABLE_NAME:portal-cliente-dev-main}
  s3:
    attachments-bucket: ${AWS_S3_ATTACHMENTS_BUCKET:portal-cliente-dev-attachments}
  sqs:
    attachments-queue-url: ${AWS_SQS_ATTACHMENTS_QUEUE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
